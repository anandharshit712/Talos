[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "talos"
version = "0.1.0"
description = "Multi-agent system for attack detection, classification, and scope analysis"
readme = "README.md"
requires-python = ">=3.11"
# TODO(P0): add `license` + a root LICENSE file once the license is chosen.
# Every design doc calls Talos open-source, but picking the license is not a build decision.
authors = [{ name = "Harshit Anand" }]
keywords = ["security", "detection", "multi-agent", "mitre-attack", "owasp"]

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML>=6.0",
]

# R1.3: the only entry points are console scripts backed by src/talos/cli/.
# There is never a launcher module at the repository root.
[project.scripts]
talos = "talos.cli.main_cli:main"

[project.urls]
Repository = "https://github.com/anandharshit712/Talos"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
talos = ["py.typed", "llm/prompts/*.md"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools"]
# docs/ is excluded because ruff formats Python code blocks inside Markdown. The design
# documents use compact, hand-aligned pseudocode on purpose ("illustrative contracts, not final
# code" -- LLD header); a formatter expanding those ladders makes them harder to read, not
# easier. tests/fixtures holds captured attack traffic, which is data, not source.
extend-exclude = ["tests/fixtures", "docs"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "PTH",  # prefer pathlib
    "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tools"]
strict = true
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# tools/checks is on the path so the rule checkers are importable by their own tests,
# while staying runnable as plain scripts (python tools/checks/run_all_checks.py).
pythonpath = ["src", "tools/checks", "."]
addopts = "-q --strict-markers"
markers = [
    "integration: multi-component tests with real wiring",
    "e2e: full pipeline tests (log file in, IncidentReport out)",
]
