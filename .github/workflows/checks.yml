name: checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gate:
    name: gate (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    # Testcontainers needs Docker, which this cycle excludes on the development machine
    # (plan scope note), so CI provisions PostgreSQL as a service instead. The integration
    # suite skips locally when TALOS_TEST_DB_DSN is unset; here it always runs.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: talos
          POSTGRES_PASSWORD: talos
          POSTGRES_DB: talos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      # Blocking: R6's hard cap and R4's stamp check gate the merge (standards 7.2).
      - name: Rule checks (R1-R6, strict)
        run: python tools/checks/run_all_checks.py --strict

      - name: Lint
        run: python -m ruff check .

      - name: Format check
        run: python -m ruff format --check .

      - name: Types
        run: python -m mypy

      - name: Apply migrations to the test database
        run: python scripts/apply_migrations.py
        env:
          TALOS_DB_DSN: postgresql://talos:talos@localhost:5432/talos_test

      - name: Tests
        run: python -m pytest
        env:
          # Only the integration suite reads this; everything else runs without a database.
          TALOS_TEST_DB_DSN: postgresql://talos:talos@localhost:5432/talos_test
