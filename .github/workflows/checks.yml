name: checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gate:
    name: gate (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      # Blocking: R6's hard cap and R4's stamp check gate the merge (standards 7.2).
      - name: Rule checks (R1-R6, strict)
        run: python tools/checks/run_all_checks.py --strict

      - name: Lint
        run: python -m ruff check .

      - name: Format check
        run: python -m ruff format --check .

      - name: Types
        run: python -m mypy

      - name: Tests
        run: python -m pytest
