# Detector thresholds and windows (LLD 10), split out of default.yaml because this is the
# most-tuned surface in the system. Detectors read these through ctx.settings.detection --
# never as module-level literals.

talos:
  detection:
    # Shared confidence curve for every rate-based detector: `base` at exactly the
    # threshold, plus `per_extra_attempt` for each failure beyond it, capped at `cap`.
    # A burst followed by a successful login never scores below `success_floor`.
    rate_confidence: { base: 0.70, per_extra_attempt: 0.02, cap: 0.95, success_floor: 0.90 }

    # Web auth brute force: many failures against one account or from one source IP.
    brute_force: { window_seconds: 120, fail_threshold: 10 }

    # Credential stuffing: few failures each, spread across many accounts (breadth, not depth).
    credential_stuffing: { window_seconds: 300, distinct_accounts: 15, fails_per_account_max: 3 }

    ssh_brute_force: { window_seconds: 120, fail_threshold: 8 }
    rdp_brute_force: { window_seconds: 120, fail_threshold: 8 }

    # IDOR: a baseline below min_baseline_observations is immature and yields a
    # low-confidence verdict rather than a false positive. The two max_* values bound what one
    # account's baseline can grow to -- it is read and rewritten on every object access, so an
    # unbounded row would put the hot path on a row that never stops growing.
    idor:
      min_baseline_observations: 50
      sequential_run_len: 5
      max_seen_object_ids: 500
      max_endpoints: 50
      # The scorer's window, and the access count that saturates the rate feature.
      window_seconds: 300
      access_rate_saturation: 30
      # Four features, weighted. sequential_run leads because consecutive ids in one window is
      # the actual signature of enumeration; novel_endpoint is lightest because a legitimate
      # user reaching a new part of the application looks exactly like it.
      weights:
        outside_range: 0.30
        sequential_run: 0.40
        novel_endpoint: 0.10
        access_rate: 0.20
      # Below the floor the scorer stays silent. Above it, a reasoning model weighs the access
      # history and judge_weight decides how far its confidence moves the deterministic score.
      low_score_floor: 0.35
      judge_weight: 0.40
      # Cold start: a low-confidence verdict that never fires, so an operator can see that
      # Talos looked and did not yet know enough. An unfamiliar account is not a guilty one.
      immature_confidence: 0.20
